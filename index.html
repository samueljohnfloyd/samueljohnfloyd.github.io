<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Samuel John Floyd</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #1e3c72, #2a5298);
    color: white;
    text-align: center;
}

header {
    padding: 60px 20px;
}

h1 {
    font-size: 3em;
    margin-bottom: 10px;
}

.button-row {
    display: flex;
    justify-content: center;
    gap: 15px;
    margin-top: 20px;
}

button {
    padding: 12px 25px;
    font-size: 1em;
    border: none;
    border-radius: 25px;
    background: white;
    color: #2a5298;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    background: #ddd;
}

.popup {
    display: none;
    margin-top: 30px;
}

.popup img {
    max-width: 90%;
    border-radius: 15px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.5);
}

/* =========================
   FNAF JUMPSCARE OVERLAY
========================= */
#jumpscareOverlay {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 9999;
    background: black;
    cursor: pointer;
}

/* Flash effect */
#jumpscareOverlay.flash {
    animation: flashEffect 0.15s infinite;
}

@keyframes flashEffect {
    0%   { background: black; }
    50%  { background: white; }
    100% { background: black; }
}

/* Jumpscare image */
#jumpscareOverlay img {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 120vw;
    height: 120vh;
    object-fit: cover;
    transform: translate(-50%, -50%) scale(1);
    animation: jumpscareZoom 0.25s ease-out, shake 0.08s infinite;
}

/* Zoom in fast */
@keyframes jumpscareZoom {
    0%   { transform: translate(-50%, -50%) scale(0.6); }
    100% { transform: translate(-50%, -50%) scale(1.2); }
}

/* Shake */
@keyframes shake {
    0%   { transform: translate(-50%, -50%) scale(1.2) translate(0px, 0px); }
    25%  { transform: translate(-50%, -50%) scale(1.2) translate(8px, -6px); }
    50%  { transform: translate(-50%, -50%) scale(1.2) translate(-8px, 6px); }
    75%  { transform: translate(-50%, -50%) scale(1.2) translate(6px, 8px); }
    100% { transform: translate(-50%, -50%) scale(1.2) translate(-6px, -8px); }
}
</style>

<script>
function stopAllSounds() {
    const sounds = document.querySelectorAll("audio");
    sounds.forEach(sound => {
        sound.pause();
        sound.currentTime = 0;
    });
}

function hideAllPopups() {
    document.getElementById("popup1").style.display = "none";
}

function showBlondeGuy() {
    // normal popup mode
    hideAllPopups();
    stopAllSounds();

    document.getElementById("popup1").style.display = "block";

    const fart = document.getElementById("fartSound");
    fart.currentTime = 0;
    fart.play();
}

function showJumpscare() {
    // hide normal stuff
    hideAllPopups();
    stopAllSounds();

    // show overlay
    const overlay = document.getElementById("jumpscareOverlay");
    overlay.style.display = "block";

    // start flash
    overlay.classList.add("flash");

    // play sound
    const laugh = document.getElementById("freddyLaugh");
    laugh.currentTime = 0;
    laugh.play();

    // stop flashing after 0.8 seconds (so it doesn't kill eyes forever)
    setTimeout(() => {
        overlay.classList.remove("flash");
    }, 800);
}

function closeJumpscare() {
    const overlay = document.getElementById("jumpscareOverlay");
    overlay.style.display = "none";
    overlay.classList.remove("flash");

    // stop sound
    const laugh = document.getElementById("freddyLaugh");
    laugh.pause();
    laugh.currentTime = 0;
}

// allow ESC to close jumpscare
document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") {
        closeJumpscare();
    }
});
</script>

</head>
<body>

<header>
    <h1>Samuel John Floyd</h1>
    <p>Welcome to my personal website.</p>

    <div class="button-row">
        <button onclick="showBlondeGuy()">Click Me</button>
        <button onclick="showJumpscare()">...</button>
    </div>

    <!-- Normal popup -->
    <div id="popup1" class="popup">
        <img src="https://cdn.discordapp.com/attachments/1209285863238795275/1472732448872992954/image.jpg?ex=6993a479&is=699252f9&hm=726796608b89dcb747849db74c73c73bfa48bf532e79bc1365b0543400b6e058&" alt="Popup Image">
    </div>

    <!-- Sounds -->
    <audio id="fartSound" preload="auto"
      src="https://cdn.discordapp.com/attachments/1209285863238795275/1472741330643063029/dry-fart.mp3?ex=6993acbf&is=69925b3f&hm=e1bf3e0be0b203a50c9b471234ba3ae94ee48d77aceb04657158c2837d3e6a45&">
    </audio>

    <audio id="freddyLaugh" preload="auto"
      src="https://cdn.discordapp.com/attachments/1209285863238795275/1472742569275560100/fnaf-freddys-laugh.mp3?ex=6993ade6&is=69925c66&hm=36cc44ecede6640dd1426af951127f580e45404ee6723ce443f138f5a7108188&">
    </audio>
</header>

<footer>
    © 2026 Samuel John Floyd
</footer>

<!-- FULLSCREEN JUMPSCARE OVERLAY -->
<div id="jumpscareOverlay" onclick="closeJumpscare()">
    <img src="https://cdn.discordapp.com/attachments/1209285863238795275/1472742334717493438/JUMOPSCAPE.jpg?ex=6993adae&is=69925c2e&hm=bf5052db88f722a978d4c37bc3b7768c9407d719159650555e4395b2d5079182&" alt="Jumpscare">
</div>

</body>
</html>
