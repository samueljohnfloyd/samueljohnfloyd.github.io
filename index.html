<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Samuel John Floyd</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #1e3c72, #2a5298);
    color: white;
    text-align: center;
}

header {
    padding: 60px 20px;
}

h1 {
    font-size: 3em;
    margin-bottom: 10px;
}

button {
    margin-top: 20px;
    padding: 12px 25px;
    font-size: 1em;
    border: none;
    border-radius: 25px;
    background: white;
    color: #2a5298;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    background: #ddd;
}

#popup {
    display: none;
    margin-top: 30px;
}

#popup img {
    max-width: 90%;
    border-radius: 15px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.5);
}
</style>

<script>
function showImage() {
    document.getElementById("popup").style.display = "block";
}
</script>

</head>
<body>

<header>
    <h1>Samuel John Floyd</h1>
    <p>Welcome to my personal website.</p>
    <button onclick="showImage()">Click Me</button>

    <div id="popup">
        <img src="https://cdn.discordapp.com/attachments/1209285863238795275/1472732448872992954/image.jpg?ex=6993a479&is=699252f9&hm=726796608b89dcb747849db74c73c73bfa48bf532e79bc1365b0543400b6e058&" alt="Popup Image">
    </div>
</header>

<footer>
    © 2026 Samuel John Floyd
</footer>

</body>
</html>
